[package]
name = "winit-async"
version = "0.5.0"
authors = ["Jayce Fayne <jayce.fayne@mailbox.org>"]
repository = "https://github.com/jaycefayne/winit-async"
edition = "2024"
description = "An async runtime based on the winit event loop."
license = "MIT"
categories = ["asynchronous", "concurrency", "gui"]
keywords = ["asynchronous", "single-threaded", "futures", "windowing"]
readme = "README.md"

[dependencies]
winit = "0.30"
async-local-channel = "0.11"
smallvec = { version = "1", features = ["const_new", "union"] }
async-local-executor = "0.6"

[features]
tokio = ["async-local-executor/tokio"]

[dev-dependencies]
anyhow = "1"
vello = { version = "0.11", features = ["wgpu"] }
